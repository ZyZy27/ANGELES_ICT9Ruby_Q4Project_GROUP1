<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { 
      background-color: #1a6fa8; 
      font-family: 'Gill Sans', 'Nunito', sans-serif; 
      margin: 0; padding: 0; 
      background-image: url(bg.png); 
      background-size: cover; 
    }

    .top-nav { background-color: #1a6fa8; 
      padding: 12px 20px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
     }

    .top-nav .school-name { 
      color: white; 
      font-weight: 600; 
      font-size: 18px; 
      line-height: 1.2; 
    }
    .top-nav .school-name span { 
      font-size: 12px; 
      font-weight: normal; 
      display: block; 
    }
    .top-nav .logo-area { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }

    .top-nav .logo-area img { 
      width: 55px; 
      height: 55px; 
      border-radius: 50%; 
    }
    .top-nav .right-area { 
      display: flex; 
      align-items: center; 
      gap: 15px; 
    }
    .top-nav .notif-icon img { 
      width: 35px; 
      height: 35px; 
    }
    .top-nav .user-box { 
      background-color: white; 
      padding: 8px 15px; 
      border-radius: 6px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-size: 14px; 
      font-weight: 600; 
      color: black; 
    }

    .top-nav .user-box img { 
      width: 30px;
      height: 30px; 
      border-radius: 50%; 
      background-color: #ccc; 
    }

    .main-layout { 
      display: flex; 
      min-height: calc(100vh - 80px); 
    }

    .sidebar { 
      width: 80px; 
      background-color: white; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 20px 0; 
      gap: 25px; 
    }
    .sidebar .nav-icon { 
      width: 36px; 
      height: 36px; 
      cursor: pointer; 
      opacity: 0.6; 
    }
    .sidebar .nav-icon:hover { 
      opacity: 1; 
    }
    .sidebar .nav-icon.active { 
      opacity: 1; 
    }
    .sidebar .logout-icon { 
      margin-top: auto; 
      margin-bottom: 20px; 
      width: 36px; 
      height: 36px; 
      cursor: pointer; 
      opacity: 0.6; 
    }
    .sidebar .logout-icon:hover { 
      opacity: 1; 
      }
</style>
</head>
<body>
  <div class="top-nav">
    <div class="logo-area">
      <img src="Scho.png" alt="School Logo">
      <div class="school-name">New Age Scholars<br>University inc.<span>ESTD. 2026</span></div>
    </div>
    <div class="right-area">
      <div class="notif-icon"><img src="notif.png" alt="Notification"></div>
      <div class="user-box">
        <p id="user" style="margin:0"></p>
        <img src="user.png" alt="User Avatar">
      </div>
    </div>
  </div>

  <div class="main-layout">
    <div class="sidebar">
      <a href="HomePage2.html"><img class="nav-icon" src="home.png" alt="Home"></a>
      <a href="Classlist.html"><img class="nav-icon" src="list.png" alt="Classlist"></a>
      <a href="quiz.html"><img class="nav-icon" src="book.png" alt="Feed"></a>
      <img class="nav-icon" src="people.png" alt="People">
      <img class="nav-icon active" src="settinngs.png" alt="Settings">
      <a href="index.html"><button onclick="logout()" style="border:none;background-color:white;"><img class="logout-icon" src="logout.png" alt="Logout"></button></a>
    </div>

    <div class="container-fluid">
      <div class="row">
        <div class="col-md-10 p-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <p class="text-muted">This is the list of activities assigned in this class.</p>
              <table class="table table-hover mt-4 text-center align-middle">
                <thead class="text-muted">
                  <tr>
                    <th>Activity</th>
                    <th>Date taken</th>
                    <th>Total Score</th>
                    <th>Status</th>
                    <th>Share</th>
                  </tr>
                </thead>
                <tbody id="performanceTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SHARE MODAL -->
  <div class="modal fade" id="shareModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Share Result</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <p id="shareText" style="font-size:16px;white-space:pre-line;"></p>
          <button class="btn btn-outline-primary mt-2" onclick="copyShareText()">Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var currentUser = JSON.parse(localStorage.getItem("currentUser"));
    if (currentUser) {
      document.getElementById('user').innerText = currentUser.name;
    } else {
      window.location.href = "login.html";
    }

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    }

    window.onload = function () {
      var gradesKey = "schoolGrades_" + currentUser.studid;
      var savedGrades = localStorage.getItem(gradesKey);
      var table = document.getElementById("performanceTableBody");

      if (!savedGrades || savedGrades === "[]") {
        table.innerHTML = "<tr><td colspan='5'>No activities taken yet.</td></tr>";
        return;
      }

      var dataArray = JSON.parse(savedGrades);
      for (var i = dataArray.length - 1; i >= 0; i--) {
        var r = dataArray[i];
        var badge = r.passFail === "Passed" ? "bg-success" : "bg-danger";
        var tr = "<tr>";
        tr += "<td><b>" + r.actName + "</b></td>";
        tr += "<td>" + r.dateTaken + "</td>";
        tr += "<td><b>" + r.scorePts + "</b></td>";
        tr += "<td><span class='badge " + badge + "'>" + r.passFail + "</span></td>";
        tr += "<td><button class='btn btn-sm btn-outline-secondary' onclick='openShare(" + i + ")'>Share</button></td>";
        tr += "</tr>";
        table.innerHTML += tr;
      }
    };

    function openShare(index) {
      var gradesKey = "schoolGrades_" + currentUser.studid;
      var allGrades = JSON.parse(localStorage.getItem(gradesKey)) || [];
      var r = allGrades[index];
      var text =
        "New Age Scholars University inc.\n" +
        "Student: " + currentUser.name + " (ID: " + currentUser.studid + ")\n" +
        "Activity: " + r.actName + "\n" +
        "Score: " + r.scorePts + "\n" +
        "Status: " + r.passFail + "\n" +
        "Date: " + r.dateTaken;
      document.getElementById("shareText").innerText = text;
      var shareModal = new bootstrap.Modal(document.getElementById("shareModal"));
      shareModal.show();
    }

    function copyShareText() {
      var text = document.getElementById("shareText").innerText;
      navigator.clipboard.writeText(text).then(function () {
        alert("Copied to clipboard!");
      });
    }
  </script>
</body>
</html>
